# E-014 Table 2 ablation — refreshed baseline (gpt-4.1-mini variant of round1_ablation_baseline GLM legacy).
# Matches knob set in `round1_hotpotqa.yaml` defaults (no special ablation; this is the reference cell).
# Per implementation_log [parallel_orchestration_plan_20260420] R31 + audit (R36): 4 yaml variants instead of new method names,
# because the 4 ablations differ only in `method_knobs`, not in the method itself (still `fixed_peer_calibrated`).
benchmark: hotpotqa
split: validation
sample_size: 200
topology: chain
max_handoff: 4
main_model: gpt-4.1-mini
temperature: 0.0
token_budget_per_sample: 2000
shared_prompt_template: prompts/main_agent_prompt.txt
methods:
  - fixed_peer_calibrated
method_knobs:
  non_synth_evidence_cap: 14
  synth_evidence_cap: 60
  forward_evidence_cap: 8
  peer_update_enabled: true
  decomposer_force_forward_enabled: true
  decomposer_force_forward_threshold: 0.9
  accept_margin: 0.02
